kafka_base_url: https://downloads.apache.org/kafka/
scala_version: 2.13
kafka_version: 3.7.0
kafka_root_dir: /usr/local
kafka_dir: "{{ kafka_root_dir }}/kafka"
kafka_user: kafka
kafka_group: kafka
KAFKA_HEAP_OPTS: -Xmx4G -Xms4G
kafka_log_dir: /data/kafka
kraft_service_path: /usr/lib/systemd/system/kafka.service
controller_quorum: "1@hostname:9093,2@hostname"
